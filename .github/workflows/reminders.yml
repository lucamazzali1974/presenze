name: Promemoria del mattino

# L'orario italiano si sposta con l'ora legale, cron no: gira in UTC e
# basta. Quindi il job parte due volte, alle 07:00 e alle 08:00 UTC, che
# sono le 9 italiane rispettivamente d'estate e d'inverno. La API route
# tiene solo la corsa che cade davvero alle 9 in Italia e scarta l'altra,
# e il registro reminder_log garantisce comunque un solo invio per evento.
#
# Setup:
#   Settings > Secrets and variables > Actions, aggiungi:
#     APP_URL      es. https://presenze-one.vercel.app
#     CRON_SECRET  lo stesso valore messo tra le variabili su Vercel

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Manda subito, ignorando il controllo delle 9'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il job dei promemoria
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -u

          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders?force=${FORCE}")

          echo "HTTP ${code}"
          cat /tmp/body.txt; echo

          case "$code" in
            200) echo "Fatto." ;;
            401) echo "::error::CRON_SECRET non combacia con quello su Vercel"; exit 1 ;;
            *)   echo "::error::Il job ha risposto ${code}"; exit 1 ;;
          esac

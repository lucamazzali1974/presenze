<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presenze — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: rgba(255, 255, 255, 0.8);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { color: #fff; font-size: 26px; font-weight: 500; margin: 0 0 10px; }
      p { margin: 0 0 24px; font-size: 15px; color: rgba(255, 255, 255, 0.55); }
      button {
        font: inherit;
        padding: 11px 22px;
        border-radius: 999px;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        cursor: pointer;
      }
      .mark { letter-spacing: 0.04em; color: #fff; margin-bottom: 26px; }
      .mark em { font-style: normal; color: #f43; }
    </style>
  </head>
  <body>
    <div>
      <p class="mark">PRE<em>/</em>SENZE</p>
      <h1>Sei offline</h1>
      <p>L'appello ha bisogno della rete per salvare le presenze.</p>
      <button onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
